name: Tests

on:
  pull_request:
    paths-ignore:
      - '**/*.md'
  push:
    branches: [main] # code coverage reporting needs to be on main so all PRs can compare against it. 

concurrency: # cancel previous workflow run if one exists. 
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: customerio/mobile-ci-tools/.github/workflows/ios-test.yml@main
    with:
      runner-label: 'xcode-27'
      # Pinned with fastlane/Scanfile: 27.0 is the only Xcode on the xcode-27 image that ships a
      # simulator runtime (iOS 27.0). Change one, check the other.
      xcode-version: '27.0'
      # Recent passing runs took up to 35 minutes; the limit stops a hung run from holding a Mac.
      timeout-minutes: 45
      scheme: 'Customer.io-Package'
      xcresult-name: 'Customer.io-Package.xcresult'
      # Must track the Ruby this repo's Gemfile.lock is resolved against; the lock pulls
      # excon 1.7, which needs >= 3.3, so the shared workflow's 3.2 default cannot install it.
      ruby-version: '3.4'
    secrets:
      CODECOV_UPLOAD_TOKEN: ${{ secrets.CODECOV_UPLOAD_TOKEN }}  
  