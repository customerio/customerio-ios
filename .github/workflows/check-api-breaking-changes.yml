name: Check for API Breaking Changes

on:
  pull_request:
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - 'api-docs/**'
      - 'scripts/check-api-changes.rb'
      - 'scripts/generate-api-docs.sh'
      - 'scripts/format-api-docs.rb'
      - 'scripts/test_format_api_docs.rb'
      - '.github/workflows/check-api-breaking-changes.yml'

concurrency: # cancel previous workflow run if one exists
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-api-breaking-changes:
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      
      - uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@main
        with:
          xcode-version: '27.0'

      - name: Install sourcekitten
        run: brew install sourcekitten

      - name: Setup Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: '3.4'
          bundler-cache: false # we don't need bundler for this workflow

      - name: Test API docs formatter
        run: ruby scripts/test_format_api_docs.rb

      - name: Check for API changes
        run: |
          # Run the API change detection script
          ruby scripts/check-api-changes.rb
