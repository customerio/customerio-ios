name: Deploy SDK

on:
  workflow_dispatch: # manually run this workflow. This allows you to manually deploy things like cococapods, not manually create a git tag. The tag needs to already be created to run this.
    inputs:
      existing-git-tag:
        description: 'Type name of existing git tag (example: 1.0.3) to checkout and manually deploy'
        required: true
        type: string

  push:
    branches: [beta, main, v1] # all branches where deployments currently occur. Make sure this list matches list of branches in  `.releaserc` file.

permissions:
  contents: write # access to push the git tag

jobs:
  # We can only generate SDK size reports on macOS and we prefer to run deployments on Linux because macOS resources are limited. 
  # Therefore, generating SDK reports is a separate job that runs before deployment.
  generate-sdk-size-report:
    name: Generate SDK size report to attach to the release 
    runs-on: macos-26
    # In order to pass data from 1 action to another, you use outputs. 
    # These are the generated reports that the deployment action depends on. 
    outputs:
      sdk-size-report: ${{ steps.generate-sdk-size-report.outputs.sdk-size-report }}
      sdk-size-including-dependencies-report: ${{ steps.generate-sdk-size-report.outputs.sdk-size-including-dependencies-report }}
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/generate-sdk-size-report
        id: generate-sdk-size-report
        with:
          GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64 }} 

  deploy-git-tag:
    name: Deploy git tag
    needs: [generate-sdk-size-report]
    runs-on: ubuntu-latest
    outputs:
      new_release_git_head: ${{ steps.semantic-release.outputs.new_release_git_head }}
      new_release_published: ${{ steps.semantic-release.outputs.new_release_published }}
      new_release_version: ${{ steps.semantic-release.outputs.new_release_version }}
    steps:
      # Mint the App installation token before checkout so we can pass it to actions/checkout.
      # This is required because actions/checkout persists its token into local git config
      # (http.https://github.com/.extraheader); whatever token the App-bypass ruleset trusts
      # must be the one persisted, otherwise semantic-release's `git push` falls back to
      # github-actions[bot] and is rejected with GH013.
      - name: Generate App installation token
        id: generate_token
        uses: actions/create-github-app-token@1b10c78c7865c340bc4f6099eb2f838309f1e8c3 # v3.1.1
        with:
          client-id: ${{ secrets.CIO_APP_CLIENT_ID }}
          private-key: ${{ secrets.CIO_APP_SECRET }}

      - uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}

      # CLI to replace strings in files. The CLI recommends using `cargo install` which is slow. This Action is fast because it downloads pre-built binaries.
      # If using sd on macos, "brew install" works great. for Linux, this is the recommended way.
      - name: Install sd CLI to use later in the workflow
        # uses: kenji-miyake/setup-sd@59a1bd7bba077f6c491f04cd9d24b524ea2db4b6 # v1.1.1
        uses: levibostian/setup-sd@cbdeed93d4fe03f9e36b73bb6d9e7c3c4805e1f9 # add-file-extension # Using fork until upstream Action has bug fixed in it.

      # We want to track the SDK binary size for each release.
      # The reports is pushed by semantic-release action below by including files listed in the `assets` array in the `.releaserc` file.
      - name: Write SDK size reports to file to include in the release
        run: |
          mkdir -p reports
          echo "${{ needs.generate-sdk-size-report.outputs.sdk-size-report }}" > reports/sdk-binary-size.txt
          echo "${{ needs.generate-sdk-size-report.outputs.sdk-size-including-dependencies-report }}" > reports/sdk-binary-size-including-dependencies.txt

          echo "Verifying the reports got written to the file system. If the files are not empty, they were generated successfully..."
          echo "SDK binary size report:"
          head reports/sdk-binary-size.txt

          echo "SDK binary size including dependencies report:"
          head reports/sdk-binary-size-including-dependencies.txt
    
      # Semantic-release tool is used to:
      # 1. Determine the next semantic version for the software during deployment.
      #    For example, if the last deployment you made was version 1.3.5 and you are releasing a new feature
      #    in this deployment, semantic release will automatically determine the version is 1.4.0 for this new release you're doing.
      #    Semantic release is able to do this by viewing commit messages since the last release. That's why this project uses a
      #    specific commit message format during pull requests.
      # 2. Updates metadata files. Such as updating the version number in package.json and adding entries to CHANGELOG.md file.
      # 3. Create git tag and push it to github.
      - name: Deploy git tag via semantic-release
        uses: cycjimmy/semantic-release-action@0a51e81a6baff2acad3ee88f4121c589c73d0f0e # v4.2.0
        id: semantic-release
        with:
          # Versions are pinned so a new semantic-release or plugin release cannot change
          # deployment behavior without a change in this repo. Bump deliberately.
          # Must stay above 22.0.1, which had a bug in the commit analyzer:
          # https://github.com/semantic-release/semantic-release/releases/tag/v22.0.1
          semantic_version: 25.0.5
          extra_plugins: |
            conventional-changelog-conventionalcommits@8
            @semantic-release/github@12.0.9
            @semantic-release/exec@7.1.0
        env:
          # Needs to push git commits to repo. Needs write access.
          GITHUB_TOKEN: ${{ steps.generate_token.outputs.token }}

      - name: Notify team of git tag being created
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        if: steps.semantic-release.outputs.new_release_published == 'true' # only run if a git tag was made.
        with:
          # Use block kit for format of the JSON payloads: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "iOS SDK git tag created",
              "username": "iOS deployment bot",
              "icon_url": "https://pngimg.com/uploads/apple_logo/apple_logo_PNG19687.png",
              "channel": "#mobile-deployments",
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*iOS* SDK git tag created successfully and deployed to Swift Package Manager! (deployment step 1 of 2)"
                      }
                  },
                  {
                      "type": "divider"
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Version ${{ steps.semantic-release.outputs.new_release_version }}*\niOS SDK deployment progress:\n ~1. <https://github.com/${{github.repository}}/releases/tag/${{steps.semantic-release.outputs.new_release_version}}|create git ta and deploy to Swift Package Manager>~\n2. deploy to cocoapods\n\n"
                      }
                  }
              ]
            }
        env:
          # Incoming webhook URL that sends message into the correct Slack channel.
          # Help on how to get the webhook URL: https://github.com/marketplace/actions/slack-send#setup-2
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify team of failure
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        if: ${{ failure() }} # only run this if any previous step failed
        with:
          # Use block kit for format of the JSON payloads: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "iOS SDK deployment failure",
              "username": "iOS deployment bot",
              "icon_url": "https://pngimg.com/uploads/apple_logo/apple_logo_PNG19687.png",
              "channel": "#mobile-deployments",
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*iOS* SDK deployment :warning: failure :warning:"
                      }
                  },
                  {
                      "type": "divider"
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "iOS SDK failed deployment during step *create git tag*. View <https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|CI server logs> to learn why and fix the issue. <https://github.com/customerio/mobile/blob/main/GIT-WORKFLOW.md|Learn more about the deployment process and how to fix errors>."
                      }
                  }
              ]
            }
        env:
          # Incoming webhook URL that sends message into the correct Slack channel.
          # Help on how to get the webhook URL: https://github.com/marketplace/actions/slack-send#setup-2
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  deploy-cocoapods:
    name: Deploy SDK to Cocoapods
    needs: [deploy-git-tag] # run after git tag is made
    # Only run if we can find a git tag to checkout.
    if: ${{ needs.deploy-git-tag.outputs.new_release_published == 'true' || github.event_name == 'workflow_dispatch' }}
    env:
      COCOAPODS_TRUNK_TOKEN: ${{ secrets.COCOAPODS_TRUNK_TOKEN }}
    runs-on: macos-26
    outputs:
      version: ${{ steps.get-version.outputs.version }}
      # 'true' when trunk refused at least one write. The job may be green (nothing
      # was published) or red (some pods were, or others failed outright), so
      # downstream steps have to read this rather than infer it from job status.
      trunk-closed: ${{ steps.push-pods.outputs.trunk-closed }}
    steps:
      - name: Checkout git tag that got created in previous step
        uses: actions/checkout@v4
        if: ${{ needs.deploy-git-tag.outputs.new_release_published == 'true' }}
        with:
          ref: ${{ needs.deploy-git-tag.outputs.new_release_git_head }}

      - name: Checkout git tag that was previously created
        uses: actions/checkout@v4
        if: ${{ github.event_name == 'workflow_dispatch' }}
        with:
          ref: ${{ inputs.existing-git-tag }}

      - name: Get SDK version
        id: get-version
        run: |
          if [[ "${{ needs.deploy-git-tag.outputs.new_release_published }}" == "true" ]]; then
            echo "version=${{ needs.deploy-git-tag.outputs.new_release_version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.existing-git-tag }}" >> $GITHUB_OUTPUT
          fi

      - uses: customerio/mobile-ci-tools/github-actions/ios/setup-ios/v1@main

      - name: Install cocoapods
        # Pinned so a new cocoapods release cannot break deployments. Bump deliberately.
        run: gem install cocoapods -v 1.16.2

      - name: Warm up CocoaPods spec repo
        run: |
          if [[ -d "$HOME/.cocoapods/repos/cocoapods" ]]; then
            pod repo update cocoapods
          else
            pod repo add cocoapods https://github.com/CocoaPods/Specs.git
          fi

      - name: Push all podspecs to CocoaPods
        id: push-pods
        run: |
          # Podspecs are grouped into tiers by their dependencies on each other.
          # Pods within a tier do not depend on each other, so they push in parallel.
          # Tiers push in order because `pod trunk push` lints each podspec and the
          # dependency versions pushed by the previous tier must already exist.
          # CustomerIOMessagingInbox depends on CustomerIOMessagingInApp (tier 2), so
          # it pushes in tier 3.
          tiers=(
            "CustomerIOCommon.podspec CustomerIOLiveActivitiesAttributes.podspec"
            "CustomerIOTrackingMigration.podspec CustomerIOMessagingPush.podspec CustomerIOMessagingInApp.podspec CustomerIOLocation.podspec CustomerIOLiveActivities.podspec CustomerIOLiveActivitiesTemplates.podspec"
            "CustomerIODataPipelines.podspec CustomerIOMessagingPushAPN.podspec CustomerIOMessagingPushFCM.podspec CustomerIOMessagingInbox.podspec CustomerIOLocationGeofence.podspec"
            "CustomerIO.podspec"
          )

          # Every podspec across all tiers, so "N of M" stays right even though the
          # dispatch loop below breaks early.
          all_podspecs=(${tiers[*]})
          total=${#all_podspecs[@]}

          published_pods=()
          refused_pods=()
          failed_pods=()
          for tier in "${tiers[@]}"; do
            pids=()
            specs=()
            for podspec in $tier; do
              ./scripts/push-cocoapod.sh "$podspec" > "push-log-$podspec.txt" 2>&1 &
              pids+=($!)
              specs+=("$podspec")
            done

            for i in "${!pids[@]}"; do
              # A bare `wait` needs `|| code=$?` to survive `set -e`. (The `if !
              # wait` form this replaced did not, because a command used as an
              # `if` condition is exempt.) Exit codes are push-cocoapod.sh's
              # contract, documented at the top of that script.
              code=0
              wait "${pids[$i]}" || code=$?
              if [[ $code -eq 0 ]]; then
                published_pods+=("${specs[$i]}")
              elif [[ $code -eq 3 ]]; then
                refused_pods+=("${specs[$i]}")
              else
                failed_pods+=("${specs[$i]}")
              fi
              echo "::group::${specs[$i]}"
              cat "push-log-${specs[$i]}.txt"
              echo "::endgroup::"
            done

            # Stop if anything in this tier failed. Later tiers depend on this one,
            # so pushing them would fail anyway. A closed trunk stops the run for
            # the same reason, except that it refuses every remaining pod too.
            if [[ ${#failed_pods[@]} -gt 0 || ${#refused_pods[@]} -gt 0 ]]; then
              break
            fi
          done

          # "are on trunk", not "were published by this run": a pod that was already
          # there answers with a duplicate entry, which is also a success here.
          on_trunk="${#published_pods[@]} of $total pods are on trunk at this version"
          # The loop breaks on the first bad tier, so the rest were never tried and
          # belong in none of the three lists. Counted here so a message cannot
          # imply trunk refused pods it was never asked about.
          not_attempted=$((total - ${#published_pods[@]} - ${#refused_pods[@]} - ${#failed_pods[@]}))
          echo "$on_trunk. Refused by trunk: ${#refused_pods[@]}. Failed: ${#failed_pods[@]}. Not attempted: $not_attempted."

          if [[ $not_attempted -gt 0 ]]; then
            on_trunk="$on_trunk, and $not_attempted were not attempted after the run stopped"
          fi

          # One message and one exit code, both derived from the same counts, so a
          # green run cannot carry an alarming message or the reverse.
          if [[ ${#failed_pods[@]} -gt 0 && ${#refused_pods[@]} -gt 0 ]]; then
            headline="iOS SDK deployment to CocoaPods failed, and trunk is read-only"
            summary="${#failed_pods[@]} pod(s) failed to publish (${failed_pods[*]}), and trunk refused ${#refused_pods[@]} more (${refused_pods[*]}). $on_trunk. A re-run cannot publish the refused pods while trunk is closed."
            failed=true
          elif [[ ${#failed_pods[@]} -gt 0 ]]; then
            summary="The following pods failed to publish: ${failed_pods[*]}. $on_trunk."
            failed=true
          elif [[ ${#refused_pods[@]} -gt 0 && ${#published_pods[@]} -gt 0 ]]; then
            # Our pods pin each other at an exact version, so a partial set cannot
            # be installed. This is the one refusal somebody has to act on, so it
            # goes red and says so in the headline, not only in the detail.
            headline="iOS SDK is partly on CocoaPods: trunk went read-only mid-release"
            summary="Trunk refused ${#refused_pods[@]} pod(s) (${refused_pods[*]}) before this release was complete. $on_trunk, so CocoaPods holds a copy of this version that cannot be installed. Someone needs to finish or yank it."
            failed=true
          elif [[ ${#refused_pods[@]} -gt 0 ]]; then
            # Nothing of ours went wrong and nothing can be re-run, so this is the
            # one refusal that stays green.
            headline="iOS SDK not deployed to CocoaPods: trunk is read-only"
            summary="Trunk is closed to new versions and refused the ${#refused_pods[@]} pod(s) it was asked for (${refused_pods[*]}), so the run stopped there. $on_trunk. There is nothing to re-run."
            failed=false
          else
            echo "All pods published successfully."
            exit 0
          fi

          if [[ ${#refused_pods[@]} -gt 0 ]]; then
            # Only the CocoaPods-FCM sample app installs from CocoaPods, but both
            # apps are skipped along with wait-for-cocoapods, and the APN-UIKit one
            # would have built from the SwiftPM tag that did ship.
            summary="$summary Sample apps were not built or distributed for this release."

            # Delimiter form, not key=value: a newline reaching $GITHUB_OUTPUT
            # would otherwise be parsed as further outputs, or fail the step and
            # report a green trunk-closed release as a deployment failure.
            {
              echo "trunk-closed=true"
              echo "refusal-headline<<CIO_EOF"
              echo "$headline"
              echo "CIO_EOF"
              echo "refusal-summary<<CIO_EOF"
              echo "$summary"
              echo "CIO_EOF"
            } >> "$GITHUB_OUTPUT"
          fi

          if [[ "$failed" == true ]]; then
            echo "::error::$summary"
            exit 1
          fi

          echo "::warning::$summary"

      - name: Notify team of successful deployment
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        if: ${{ success() && steps.push-pods.outputs.trunk-closed != 'true' }}
        with:
          # Use block kit for format of the JSON payloads: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "iOS SDK deployed to CocoaPods",
              "username": "iOS deployment bot",
              "icon_url": "https://pngimg.com/uploads/apple_logo/apple_logo_PNG19687.png",
              "channel": "#mobile-deployments",
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*iOS* SDK deployed to Cocoapods! (deployment step 2 of 2)"
                      }
                  },
                  {
                      "type": "divider"
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*Version ${{ steps.get-version.outputs.version }}*\n\niOS SDK deployment progress:\n ~1. <https://github.com/${{github.repository}}/releases/tag/${{ steps.get-version.outputs.version }}|create git tag and deploy to Swift Package Manager>~\n~2. deploy to cocoapods~\n\nBuilding sample apps with latest SDK version will begin automatically."
                      }
                  }
              ]
            }
        env:
          # Incoming webhook URL that sends message into the correct Slack channel.
          # Help on how to get the webhook URL: https://github.com/marketplace/actions/slack-send#setup-2
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify team that CocoaPods refused the release
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        # Not success(): a partial release goes red, and that is exactly the
        # refusal the team most needs this message for.
        if: ${{ !cancelled() && steps.push-pods.outputs.trunk-closed == 'true' }}
        with:
          # Use block kit for format of the JSON payloads: https://app.slack.com/block-kit-builder
          # toJSON quotes and escapes these values. Pasting them in raw would let a
          # quote in the version or the summary produce invalid JSON, which fails
          # this step and reports a green release as a deployment failure.
          payload: |
            {
              "text": ${{ toJSON(steps.push-pods.outputs.refusal-headline) }},
              "username": "iOS deployment bot",
              "icon_url": "https://pngimg.com/uploads/apple_logo/apple_logo_PNG19687.png",
              "channel": "#mobile-deployments",
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": ${{ toJSON(format('*{0}*', steps.push-pods.outputs.refusal-headline)) }}
                      }
                  },
                  {
                      "type": "divider"
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": ${{ toJSON(format('*Version {0}* is released on Swift Package Manager. {1} <https://github.com/{2}/actions/runs/{3}|CI server logs>. See <https://blog.cocoapods.org/CocoaPods-Specs-Repo/|CocoaPods Trunk Read-only Plan>.', steps.get-version.outputs.version, steps.push-pods.outputs.refusal-summary, github.repository, github.run_id)) }}
                      }
                  }
              ]
            }
        env:
          # Incoming webhook URL that sends message into the correct Slack channel.
          # Help on how to get the webhook URL: https://github.com/marketplace/actions/slack-send#setup-2
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify team of failure
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        # A closed trunk gets the message above instead, which carries the failed
        # pods and the run link when both happened at once. Two alerts for one run
        # would leave the team reconciling them.
        if: ${{ failure() && steps.push-pods.outputs.trunk-closed != 'true' }}
        with:
          # Use block kit for format of the JSON payloads: https://app.slack.com/block-kit-builder
          payload: |
            {
              "text": "iOS SDK deployment failure",
              "username": "iOS deployment bot",
              "icon_url": "https://pngimg.com/uploads/apple_logo/apple_logo_PNG19687.png",
              "channel": "#mobile-deployments",
              "blocks": [
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "*iOS* SDK deployment :warning: failure :warning:"
                      }
                  },
                  {
                      "type": "divider"
                  },
                  {
                      "type": "section",
                      "text": {
                          "type": "mrkdwn",
                          "text": "iOS SDK failed deployment during step *deploy to cocoapods*. View <https://github.com/${{github.repository}}/actions/runs/${{github.run_id}}|CI server logs> to learn why and fix the issue. <https://github.com/customerio/mobile/blob/main/GIT-WORKFLOW.md|Learn more about the deployment process and how to fix errors>."
                      }
                  }
              ]
            }
        env:
          # Incoming webhook URL that sends message into the correct Slack channel.
          # Help on how to get the webhook URL: https://github.com/marketplace/actions/slack-send#setup-2
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

  wait-for-cocoapods:
    name: Wait for deploy-cocoapods to finish
    needs: [deploy-cocoapods]
    runs-on: ubuntu-latest
    # Nothing reached the CDN when trunk refused the writes, so the poll below
    # would spend its full 20 minute budget waiting for versions that are not
    # coming. Skipping this also skips build-sample-apps, which needs it - that is
    # the only thing keeping it from installing pod versions that do not exist, so
    # keep this job in its `needs`.
    if: ${{ success() && needs.deploy-cocoapods.outputs.trunk-closed != 'true' }}
    steps:
      - name: Wait for CocoaPods CDN propagation
        run: |
          # Poll the CocoaPods CDN until it serves the new version of every pod,
          # instead of sleeping a fixed 20 minutes. Propagation usually takes a few
          # minutes, so this typically saves 15+ minutes per release.
          # The CDN shards its pod index by the first 3 hex chars of md5(pod name).
          version="${{ needs.deploy-cocoapods.outputs.version }}"
          if [[ -z "$version" ]]; then
            echo "::error::Could not determine the released version to wait for."
            exit 1
          fi

          pods=(
            CustomerIOCommon
            CustomerIOTrackingMigration
            CustomerIODataPipelines
            CustomerIOMessagingPush
            CustomerIOMessagingPushAPN
            CustomerIOMessagingPushFCM
            CustomerIOMessagingInApp
            CustomerIOMessagingInbox
            CustomerIOLocation
            CustomerIOLiveActivitiesAttributes
            CustomerIOLiveActivities
            CustomerIOLiveActivitiesTemplates
            CustomerIO
          )

          # Give up after 20 minutes, the previous fixed wait time. On timeout we
          # continue instead of failing, matching the old behavior of proceeding
          # after the sleep regardless of CDN state.
          deadline=$((SECONDS + 1200))
          for pod in "${pods[@]}"; do
            md5=$(printf '%s' "$pod" | md5sum | cut -c1-3)
            shard="${md5:0:1}_${md5:1:1}_${md5:2:1}"
            url="https://cdn.cocoapods.org/all_pods_versions_${shard}.txt"

            until curl -sf "${url}?cachebust=$(date +%s)" | grep "^${pod}/" | tr '/' '\n' | grep -qx "$version"; do
              if (( SECONDS >= deadline )); then
                echo "::warning::Timed out waiting for the CDN to serve ${pod} ${version}. Continuing anyway."
                exit 0
              fi
              echo "CDN does not serve ${pod} ${version} yet. Retrying in 30s..."
              sleep 30
            done
            echo "CDN serves ${pod} ${version}."
          done
          echo "CocoaPods CDN propagation completed."

  # New job to build sample apps after successful deployment to CocoaPods
  build-sample-apps:
    name: Build sample apps with latest SDK version
    needs: [deploy-cocoapods, wait-for-cocoapods]
    if: ${{ success() }}
    uses: ./.github/workflows/reusable_build_sample_apps.yml
    with:
      use_latest_sdk_version: true
