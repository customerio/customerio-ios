name: SDK size report

on:
  pull_request:
    # `edited` re-runs the report when a PR is retargeted (the baseline is the
    # base commit); other edits are skipped by the job condition below.
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '**/*.podspec'
      # The measured app and the lanes that build it
      - 'Apps/APN-UIKit/**'
      - 'Apps/Common/**'
      - 'Apps/fastlane/**'
      # The size tooling itself; deploy-sdk.yml needs it to tag a release
      - '.github/actions/generate-sdk-size-report/**'
      - '.github/actions/build-sample-app/**'
      - '.github/actions/main-sample-app-build/**'
      - '.github/actions/install-bloaty-from-source/**'
      - '.github/workflows/size-report.yml'
      - '!**/*.md'
  push:
    branches: [main]
  workflow_dispatch: # allow manual run

concurrency:
  # Cancel a superseded in-flight size run so it doesn't hold a macOS slot. An edit
  # that doesn't change the base gets its own group, so it can't cancel an in-flight
  # size run; its job is skipped below.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event.action == 'edited' && github.event.changes.base == null &&
      'metadata' || 'validation'
    }}
  cancel-in-progress: true

jobs:
  # Size is a release guardrail. The `paths:` filter above scopes PR runs to the
  # changes that can move binary size; main keeps warming the exact-SHA baseline
  # cache to avoid rebuilding it.
  generate-sdk-size-reports:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      (github.event.action != 'edited' || github.event.changes.base != null))
    # xcode-27 is a single-Xcode preview image: the label selects the toolchain and
    # the action is passed an empty xcode-version so it uses the image default. Xcode 27
    # and its simulator runtime ship preinstalled on this image (no download at run time).
    runs-on: xcode-27
    timeout-minutes: 60
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/generate-sdk-size-report
        id: generate-sdk-size-report
        with:
          GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64 }}
          xcode-version: '' # single-Xcode image; setup-xcode cannot resolve its version string
          baseline-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.sha || '' }}

      - name: Find existing "SDK size reports" comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: find-sdk-size-report-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: <!-- sdk size reports -->

      - name: Send SDK size reports to the PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.find-sdk-size-report-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- sdk size reports -->
            # SDK binary size reports 📊

            <details>
            <summary>SDK binary size of this PR</summary>

            ```
            ${{ steps.generate-sdk-size-report.outputs.sdk-size-report }}
            ```

            </details>

            <details>
            <summary>SDK binary size diff report vs. main branch</summary>

            ```
            ${{ steps.generate-sdk-size-report.outputs.sdk-size-diff-report }}
            ```

            </details>
