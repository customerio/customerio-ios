name: Semantic PR helper

on:
  pull_request:
    types: [opened, reopened, edited, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # to comment on PRs
    steps:
    # Uses the same conventionalcommits preset as semantic-release (.releaserc), so a title that
    # passes here is one semantic-release can read once the PR is squash merged.
    - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
      id: lint-pr-title
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    # The lint step fails the job; always() lets this run with its error message.
    - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: always() && steps.lint-pr-title.outputs.error_message != null
      with:
        header: pr-title-lint-error
        message: |
          Hey there @${{ github.event.pull_request.user.login }} 👋. This project uses [Conventional Commits](https://www.conventionalcommits.org/) for pull request titles, and the title of this pull request needs a fix. I'll check again after you edit the title.

          ```
          ${{ steps.lint-pr-title.outputs.error_message }}
          ```

          The title should look like `<type>: short description of change`, or `<type>!: short description of breaking change` for a breaking change. Examples: `feat: edit profile photo`, `fix(push): handle missing token`, `refactor!: remove deprecated v1 endpoints`.

    # Remove the help comment once the title is valid.
    - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
      if: steps.lint-pr-title.outputs.error_message == null
      with:
        header: pr-title-lint-error
        delete: true
