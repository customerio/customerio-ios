name: Maestro SDK E2E

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch:
    inputs:
      profile:
        description: Suite profile
        type: choice
        options:
          - standard
          - quick
          - single
          - remote
        default: standard
      suite:
        description: Suite to run when profile is single
        type: choice
        options:
          - smoke
          - geofence
          - message-inbox
          - live-activities
          - live-activities-remote
        default: smoke
      harness_ref:
        description: customerio/mobile-e2e branch, tag, or commit
        type: string
        default: main
  schedule:
    - cron: "41 6 * * 1-5"

concurrency:
  # Unrelated label events skip E2E and cannot cancel a requested ci:full run.
  group: >-
    maestro-ios-${{ github.ref }}-${{
      github.event_name == 'pull_request' &&
      github.event.action == 'labeled' &&
      github.event.label.name != 'ci:full' &&
      'metadata' || 'validation'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare:
    name: Select iOS suites
    if: >-
      (vars.MOBILE_E2E_ENABLED == 'true' || github.event_name == 'workflow_dispatch') &&
      (github.event_name != 'pull_request' ||
      (contains(github.event.pull_request.labels.*.name, 'ci:full') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full') &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      suites: ${{ steps.select.outputs.suites }}
    steps:
      - name: Select suite matrix
        timeout-minutes: 1
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
          REQUESTED_SUITE: ${{ inputs.suite }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            profile=quick
          elif [[ "$EVENT_NAME" == "schedule" ]]; then
            profile=standard
          else
            profile="${REQUESTED_PROFILE:-standard}"
          fi

          case "$profile" in
            quick) suites='["smoke"]' ;;
            # geofence is paused: the iOS 27 simulator reports region monitoring as
            # unsupported (isMonitoringAvailable == false, CLMonitor conditionUnsupported),
            # so the flow fails on every run on the Xcode 27 image. Still runnable on demand
            # with profile=single, suite=geofence. Re-add it to this list once the simulator
            # supports region monitoring or the flow stops depending on OS crossings.
            standard) suites='["smoke","message-inbox","live-activities"]' ;;
            single) suites="[\"${REQUESTED_SUITE:-smoke}\"]" ;;
            remote) suites='["live-activities-remote"]' ;;
            *) echo "Unknown profile: $profile" >&2; exit 2 ;;
          esac
          echo "suites=$suites" >> "$GITHUB_OUTPUT"

      - name: Notify #squad-mobile-alerts of a scheduled failure
        timeout-minutes: 2
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: customerio/mobile-ci-tools/github-actions/slack-notify-scheduled-failure/v1@main
        with:
          slack_webhook_url: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          label: suite selection

  e2e:
    name: iOS ${{ matrix.suite }}
    needs: prepare
    # Intentionally omit always(): a skipped or failed prepare job must keep
    # secret-dependent E2E from running.
    if: >-
      vars.MOBILE_E2E_ENABLED == 'true' ||
      github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    # Step budgets total 56 minutes, leaving room before the job cancellation.
    # A step timeout fails the job while evidence and notification steps can still run.
    timeout-minutes: 60
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
      # Must exist on the image's iOS 27.0 runtime, which has no iPhone 17 Pro.
      IOS_SIMULATOR_NAME: iPhone 18 Pro
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJSON(needs.prepare.outputs.suites) }}
    steps:
      - name: Check out iOS SDK
        timeout-minutes: 2
        uses: actions/checkout@v7

      - name: Check out shared E2E harness
        timeout-minutes: 2
        uses: actions/checkout@v7
        with:
          repository: customerio/mobile-e2e
          ref: ${{ inputs.harness_ref || 'main' }}
          path: .e2e-harness

      - name: Install Maestro and evidence dependencies
        timeout-minutes: 5
        run: |
          curl -Ls https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          brew install ffmpeg
          python3 -m venv "$RUNNER_TEMP/mobile-e2e-venv"
          "$RUNNER_TEMP/mobile-e2e-venv/bin/pip" install Pillow
          echo "$RUNNER_TEMP/mobile-e2e-venv/bin" >> "$GITHUB_PATH"

      - name: Configure sample workspace
        timeout-minutes: 1
        env:
          CDP_API_KEY: ${{ secrets.CUSTOMERIO_APN_WORKSPACE_CDP_API_KEY }}
          SITE_ID: ${{ secrets.CUSTOMERIO_APN_WORKSPACE_SITE_ID }}
        run: |
          for name in CDP_API_KEY SITE_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured for Maestro E2E"
              exit 1
            fi
          done
          cp "Apps/APN-UIKit/BuildEnvironment.sample.swift" \
             "Apps/APN-UIKit/BuildEnvironment.swift"
          ruby -pi -e '
            gsub("CUSTOMERIO_WORKSPACE_CDP_API_KEY", ENV.fetch("CDP_API_KEY"))
            gsub("CUSTOMERIO_WORKSPACE_SITE_ID", ENV.fetch("SITE_ID"))
            gsub("CUSTOMERIO_WORKSPACE_NAME", "Mobile E2E")
          ' "Apps/APN-UIKit/BuildEnvironment.swift"

      - name: Validate E2E backend configuration
        timeout-minutes: 1
        env:
          SUITE: ${{ matrix.suite }}
          MAESTRO_APP_API_KEY: ${{ secrets.MOBILE_E2E_APP_API_KEY }}
          INBOX_TRANSACTIONAL_MESSAGE_ID: ${{ vars.MOBILE_E2E_INBOX_TRANSACTIONAL_MESSAGE_ID }}
        run: |
          required=(MAESTRO_APP_API_KEY)
          if [[ "$SUITE" == "message-inbox" ]]; then
            required+=(INBOX_TRANSACTIONAL_MESSAGE_ID)
          fi
          for name in "${required[@]}"; do
            if [[ -z "${!name}" ]]; then
              echo "::error::$name is not configured for Maestro E2E"
              exit 1
            fi
          done

      - name: Run SDK to backend E2E
        timeout-minutes: 40
        env:
          SUITE: ${{ matrix.suite }}
          MAESTRO_APP_API_KEY: ${{ secrets.MOBILE_E2E_APP_API_KEY }}
          INBOX_TRANSACTIONAL_MESSAGE_ID: ${{ vars.MOBILE_E2E_INBOX_TRANSACTIONAL_MESSAGE_ID }}
          LIVE_ACTIVITY_APP_IDENTIFIER: ${{ secrets.MOBILE_E2E_LIVE_ACTIVITY_APP_IDENTIFIER }}
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          ./.e2e-harness/e2e run \
            --platform ios \
            --sdk-repo "$GITHUB_WORKSPACE" \
            --suite "$SUITE" \
            --headless

      - name: Sanitize E2E evidence
        timeout-minutes: 1
        id: sanitize
        if: always()
        env:
          MAESTRO_APP_API_KEY: ${{ secrets.MOBILE_E2E_APP_API_KEY }}
          LIVE_ACTIVITY_APP_IDENTIFIER: ${{ secrets.MOBILE_E2E_LIVE_ACTIVITY_APP_IDENTIFIER }}
          IOS_CDP_API_KEY: ${{ secrets.CUSTOMERIO_APN_WORKSPACE_CDP_API_KEY }}
          IOS_SITE_ID: ${{ secrets.CUSTOMERIO_APN_WORKSPACE_SITE_ID }}
        run: |
          if [[ -d artifacts/e2e ]]; then
            python3 .e2e-harness/scripts/redact_artifacts.py artifacts/e2e
            python3 .e2e-harness/scripts/redact_artifacts.py --check artifacts/e2e
          fi

      - name: Upload E2E evidence
        timeout-minutes: 2
        if: ${{ always() && steps.sanitize.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-${{ matrix.suite }}
          path: artifacts/e2e/
          if-no-files-found: warn
          retention-days: 14

      - name: Notify #squad-mobile-alerts of a scheduled failure
        timeout-minutes: 2
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        uses: customerio/mobile-ci-tools/github-actions/slack-notify-scheduled-failure/v1@main
        with:
          slack_webhook_url: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          label: ${{ matrix.suite }}
