name: Compile changed sample apps

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths:
      - 'Apps/APN-UIKit/**'
      - 'Apps/CocoaPods-FCM/**'
      - 'Apps/Common/**'
      - 'Sources/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '*.podspec'
      - 'scripts/cocoapods_deployment_target.rb'
      - '.github/workflows/compile-changed-sample-apps.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release_policy:
    uses: ./.github/workflows/reusable-release-policy.yml
    permissions:
      contents: read
    with:
      pr_title: ${{ github.event.pull_request.title }}
      pr_body: ${{ github.event.pull_request.body || '' }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      head_repository: ${{ github.event.pull_request.head.repo.full_name }}
      target_repository: ${{ github.repository }}
      pr_author: ${{ github.event.pull_request.user.login }}
      ci_full: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}

  detect-changes:
    # Signed builds own internal release-bearing and explicitly full PRs. Forks
    # retain this unsigned lane because secret-dependent builds cannot run there.
    if: >-
      always() &&
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
      github.event.pull_request.head.repo.full_name != github.repository ||
      (needs.release_policy.result == 'success' &&
      github.event.action != 'edited' &&
      needs.release_policy.outputs.full_validation != 'true'))
    needs: release_policy
    runs-on: ubuntu-latest
    outputs:
      apn: ${{ steps.changes.outputs.apn }}
      fcm: ${{ steps.changes.outputs.fcm }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select affected sample apps
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          apn=false
          fcm=false

          git cat-file -e "$BASE_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^{commit}"
          changed_paths="$RUNNER_TEMP/changed-sample-paths"
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_paths"

          while IFS= read -r -d '' path; do
            case "$path" in
              *.md)
                ;;
              Apps/APN-UIKit/*)
                apn=true
                ;;
              Sources/*)
                apn=true
                ;;
              Apps/CocoaPods-FCM/*)
                fcm=true
                ;;
              *.podspec|scripts/cocoapods_deployment_target.rb)
                fcm=true
                ;;
              Apps/Common/*|Package.swift|Package.resolved|.github/workflows/compile-changed-sample-apps.yml)
                apn=true
                fcm=true
                ;;
            esac
          done < "$changed_paths"

          echo "apn=$apn" >> "$GITHUB_OUTPUT"
          echo "fcm=$fcm" >> "$GITHUB_OUTPUT"

  compile-apn:
    name: Compile APN sample
    needs: detect-changes
    if: needs.detect-changes.outputs.apn == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.6'

      - name: Prepare placeholder build environment
        run: cp 'Apps/APN-UIKit/BuildEnvironment.sample.swift' 'Apps/APN-UIKit/BuildEnvironment.swift'

      - name: Compile APN sample without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project 'Apps/APN-UIKit/APN UIKit.xcodeproj' \
            -scheme 'APN UIKit' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/apn-sample" \
            CODE_SIGNING_ALLOWED=NO \
            build

  compile-fcm:
    name: Compile FCM sample
    needs: detect-changes
    if: needs.detect-changes.outputs.fcm == 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install Xcode
        uses: maxim-lobanov/setup-xcode@v1.6.0
        with:
          xcode-version: '26.6'

      - name: Prepare placeholder build environment
        run: cp 'Apps/CocoaPods-FCM/BuildEnvironment.sample.swift' 'Apps/CocoaPods-FCM/BuildEnvironment.swift'

      - name: Install CocoaPods
        run: gem install cocoapods -v 1.16.2 --no-document

      - name: Resolve FCM sample dependencies
        run: pod _1.16.2_ install --project-directory='Apps/CocoaPods-FCM'

      - name: Compile FCM sample without signing
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace 'Apps/CocoaPods-FCM/test cocoapods.xcworkspace' \
            -scheme 'test cocoapods' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/fcm-sample" \
            CODE_SIGNING_ALLOWED=NO \
            build
