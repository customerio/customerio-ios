name: Lint

on:
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    uses: customerio/mobile-ci-tools/.github/workflows/ios-lint.yml@main
    with:
      # Temporary: run lint on the second runner pool. Do not merge.
      runner-label: ${{ vars.MACOS_OVERFLOW_RUNNER_LABEL }}
