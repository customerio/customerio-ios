name: Lint

on:
  pull_request:
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    uses: customerio/mobile-ci-tools/.github/workflows/ios-lint.yml@main
    with:
      runner-label: 'xcode-27'
      # Lint finishes in under 2 minutes; the limit stops a hung job from holding a Mac.
      timeout-minutes: 10
