name: Xcode 27 preview compatibility

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/ios-toolchain-compatibility.yml'
      - 'Apps/APN-UIKit/**'
      - 'Apps/CocoaPods-FCM/**'
      - 'Apps/Common/**'
      - 'Package.swift'
      - 'Package.resolved'
      - '*.podspec'
      - 'scripts/cocoapods_deployment_target.rb'
  schedule:
    # Stagger preview demand across repositories instead of competing for the
    # hosted macOS pool at the top of the hour.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Scheduled and manual runs for main share one slot. Pull-request runs use
  # their merge ref, so they do not cancel the nightly.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LAUNCH_SURVIVAL_SECONDS: '10'

jobs:
  select-fixtures:
    name: Select Xcode 27 fixtures
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0

      - name: Select affected fixtures
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          apn=false
          fcm=false

          if [[ "$EVENT_NAME" != 'pull_request' ]]; then
            apn=true
            fcm=true
          else
            changed_paths="$RUNNER_TEMP/xcode-27-changed-paths"
            git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changed_paths"
            while IFS= read -r -d '' path; do
              case "$path" in
                *.md)
                  ;;
                Apps/APN-UIKit/*)
                  apn=true
                  ;;
                Apps/CocoaPods-FCM/*|*.podspec|scripts/cocoapods_deployment_target.rb)
                  fcm=true
                  ;;
                Apps/Common/*|Package.swift|Package.resolved|.github/workflows/ios-toolchain-compatibility.yml)
                  apn=true
                  fcm=true
                  ;;
              esac
            done < "$changed_paths"
          fi

          matrix='[]'
          if [[ "$apn" == 'true' ]]; then
            matrix=$(jq -c '. + [{"fixture":"native-apn","app-name":"APN UIKit.app"}]' <<< "$matrix")
          fi
          if [[ "$fcm" == 'true' ]]; then
            matrix=$(jq -c '. + [{"fixture":"customerio-ios-fcm","app-name":"test cocoapods.app"}]' <<< "$matrix")
          fi
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  compile:
    # Preview-toolchain compatibility follows integration and packaging paths.
    # Ordinary source regressions are compiled and launch-tested on the stable
    # toolchain in compile-changed-sample-apps.yml, while the nightly still runs
    # both preview fixtures against all source changes accumulated on main.
    needs: select-fixtures
    if: needs.select-fixtures.outputs.matrix != '[]'
    name: Xcode 27 preview (${{ matrix.fixture }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.select-fixtures.outputs.matrix) }}

    steps:
      - name: Check out iOS SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Report and verify toolchain family
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@main
        with:
          expected-xcode-major: '27'
          expected-ios-sdk-major: '27'

      - name: Prepare placeholder build environment
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          if [[ "$FIXTURE" == 'native-apn' ]]; then
            source_path='Apps/APN-UIKit/BuildEnvironment.sample.swift'
            destination_path='Apps/APN-UIKit/BuildEnvironment.swift'
          else
            source_path='Apps/CocoaPods-FCM/BuildEnvironment.sample.swift'
            destination_path='Apps/CocoaPods-FCM/BuildEnvironment.swift'
          fi
          cp "$source_path" "$destination_path"

      - name: Install CocoaPods for FCM fixture
        if: matrix.fixture == 'customerio-ios-fcm'
        run: gem install cocoapods -v 1.16.2 --no-document

      - name: Resolve FCM fixture dependencies
        if: matrix.fixture == 'customerio-ios-fcm'
        shell: bash
        run: |
          set -o pipefail
          pod _1.16.2_ install --project-directory='Apps/CocoaPods-FCM' 2>&1 | tee "$RUNNER_TEMP/${{ matrix.fixture }}-pod-install.log"

      - name: Compile native APN fixture
        if: matrix.fixture == 'native-apn'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -project 'Apps/APN-UIKit/APN UIKit.xcodeproj' \
            -scheme 'APN UIKit' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/${{ matrix.fixture }}-xcode-27" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/${{ matrix.fixture }}-build.log"

      - name: Compile CocoaPods FCM fixture
        if: matrix.fixture == 'customerio-ios-fcm'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace 'Apps/CocoaPods-FCM/test cocoapods.xcworkspace' \
            -scheme 'test cocoapods' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/${{ matrix.fixture }}-xcode-27" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/${{ matrix.fixture }}-build.log"

      - name: Resolve built simulator app
        shell: bash
        run: |
          set -euo pipefail
          app_path="$RUNNER_TEMP/${{ matrix.fixture }}-xcode-27/Build/Products/Debug-iphonesimulator/${{ matrix.app-name }}"
          if [[ ! -d "$app_path" ]]; then
            echo "::error::built simulator app not found at $app_path"
            exit 1
          fi
          echo "APP_PRODUCT_PATH=$app_path" >> "$GITHUB_ENV"

      - name: Install and launch fixture
        uses: customerio/mobile-ci-tools/github-actions/ios/launch-simulator-app/v1@main
        with:
          app-path: ${{ env.APP_PRODUCT_PATH }}
          expected-ios-major: '27'
          survival-seconds: ${{ env.LAUNCH_SURVIVAL_SECONDS }}
          log-path: ${{ runner.temp }}/${{ matrix.fixture }}-launch.log

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcode-27-preview-${{ matrix.fixture }}-logs
          path: |
            ${{ runner.temp }}/${{ matrix.fixture }}-*.log
          if-no-files-found: error
          retention-days: 7
