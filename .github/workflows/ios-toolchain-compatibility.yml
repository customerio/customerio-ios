name: Xcode 27 preview compatibility

on:
  pull_request:
    # Ordinary source changes are covered by the nightly run. Only workflow changes opt a PR into
    # scarce preview macOS capacity; stable required CI continues to cover every source PR.
    paths:
      - '.github/workflows/ios-toolchain-compatibility.yml'
  schedule:
    # Stagger preview demand across repositories instead of competing for the
    # hosted macOS pool at the top of the hour.
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Xcode 27 preview (${{ matrix.fixture }})
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        fixture:
          - native-apn
          - customerio-ios-fcm

    steps:
      - name: Check out iOS SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Report and verify toolchain family
        id: toolchain
        uses: customerio/mobile-ci-tools/github-actions/ios/report-toolchain/v1@main
        with:
          expected-xcode-major: '27'
          expected-ios-sdk-major: '27'

      - name: Prepare placeholder build environment
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          set -euo pipefail
          if [[ "$FIXTURE" == 'native-apn' ]]; then
            source_path='Apps/APN-UIKit/BuildEnvironment.sample.swift'
            destination_path='Apps/APN-UIKit/BuildEnvironment.swift'
          else
            source_path='Apps/CocoaPods-FCM/BuildEnvironment.sample.swift'
            destination_path='Apps/CocoaPods-FCM/BuildEnvironment.swift'
          fi
          cp "$source_path" "$destination_path"

      - name: Install CocoaPods for FCM fixture
        if: matrix.fixture == 'customerio-ios-fcm'
        run: gem install cocoapods -v 1.16.2 --no-document

      - name: Resolve FCM fixture dependencies
        if: matrix.fixture == 'customerio-ios-fcm'
        shell: bash
        run: |
          set -o pipefail
          pod _1.16.2_ install --project-directory='Apps/CocoaPods-FCM' 2>&1 | tee "$RUNNER_TEMP/${{ matrix.fixture }}-pod-install.log"

      - name: Compile native APN fixtures
        id: compile-apn
        if: matrix.fixture == 'native-apn'
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project 'Apps/APN-UIKit/APN UIKit.xcodeproj' \
            -scheme 'APN UIKit' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/${{ matrix.fixture }}-xcode-27" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/${{ matrix.fixture }}-build.log"

          scene_info_plist="$RUNNER_TEMP/${{ matrix.fixture }}-xcode-27/Build/Products/Debug-iphonesimulator/APN UIKit.app/Info.plist"
          test -f "$scene_info_plist"
          plutil -extract UIApplicationSceneManifest xml1 -o - "$scene_info_plist" >/dev/null

          xcodebuild \
            -project 'Apps/APN-UIKit/APN UIKit.xcodeproj' \
            -scheme 'APN UIKit' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/${{ matrix.fixture }}-appdelegate-only-xcode-27" \
            -xcconfig Apps/APN-UIKit/Fixtures/IOS27Lifecycle/AppDelegateOnly.xcconfig \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/${{ matrix.fixture }}-appdelegate-only-build.log"

          control_info_plist="$RUNNER_TEMP/${{ matrix.fixture }}-appdelegate-only-xcode-27/Build/Products/Debug-iphonesimulator/APN UIKit.app/Info.plist"
          test -f "$control_info_plist"
          if plutil -extract UIApplicationSceneManifest xml1 -o - "$control_info_plist" >/dev/null 2>&1; then
            echo 'AppDelegate-only control unexpectedly contains UIApplicationSceneManifest.' >&2
            exit 1
          fi

          simulator_udid="$(xcrun simctl list devices available --json | python3 -c '
          import json
          import sys

          payload = json.load(sys.stdin)
          for runtime, devices in sorted(payload.get("devices", {}).items(), reverse=True):
              if ".iOS-27-" not in runtime:
                  continue
              for device in devices:
                  if device.get("isAvailable", True) and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iOS 27 iPhone simulator for lifecycle tests.")
          ')"
          xcodebuild \
            -project 'Apps/APN-UIKit/APN UIKit.xcodeproj' \
            -scheme 'APN UIKit' \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=$simulator_udid" \
            -derivedDataPath "$RUNNER_TEMP/${{ matrix.fixture }}-lifecycle-tests" \
            -only-testing:'APN UIKitTests/LifecycleTraceRecorderTests' \
            -only-testing:'APN UIKitTests/LifecycleTraceEvidenceTests' \
            -only-testing:'APN UIKitTests/LifecycleTraceCaptureGuardrailTests' \
            CODE_SIGNING_ALLOWED=NO \
            test 2>&1 | tee "$RUNNER_TEMP/${{ matrix.fixture }}-lifecycle-tests.log"

      - name: Compile CocoaPods FCM fixture
        id: compile-fcm
        if: matrix.fixture == 'customerio-ios-fcm'
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace 'Apps/CocoaPods-FCM/test cocoapods.xcworkspace' \
            -scheme 'test cocoapods' \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/${{ matrix.fixture }}-xcode-27" \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee "$RUNNER_TEMP/${{ matrix.fixture }}-build.log"

      - name: Record compile result
        if: steps.compile-apn.outcome == 'success' || steps.compile-fcm.outcome == 'success'
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
          XCODE_VERSION: ${{ steps.toolchain.outputs.xcode-version }}
          XCODE_BUILD: ${{ steps.toolchain.outputs.xcode-build }}
          IOS_SIMULATOR_SDK: ${{ steps.toolchain.outputs.iphonesimulator-sdk }}
        run: |
          set -euo pipefail
          : "${XCODE_VERSION:?missing xcode-version output}"
          : "${XCODE_BUILD:?missing xcode-build output}"
          : "${IOS_SIMULATOR_SDK:?missing iphonesimulator-sdk output}"
          {
            echo '## Native fixture compile'
            echo
            echo '**Classification:** compile-passed'
            echo "**Fixture:** $FIXTURE"
            if [[ "$FIXTURE" == 'native-apn' ]]; then
              echo '**Host topologies:** UIScene and AppDelegate-only control'
            fi
            echo "**Toolchain:** Xcode $XCODE_VERSION build $XCODE_BUILD, iphonesimulator $IOS_SIMULATOR_SDK"
            echo '**Scope:** unsigned simulator compile only; no launch, callback, push-delivery, signing, or App Store claim'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record compile failure
        if: failure() && (steps.compile-apn.outcome == 'failure' || steps.compile-fcm.outcome == 'failure')
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          {
            echo '## Native fixture compile'
            echo
            echo '**Classification:** fixture-compile-failed'
            echo "**Fixture:** $FIXTURE"
            echo '**Toolchain family:** Xcode 27 / iOS SDK 27'
            echo '**Next step:** inspect the uploaded build log for the exact compiler failure'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record setup failure
        if: failure() && steps.toolchain.outcome != 'failure' && steps.compile-apn.outcome == 'skipped' && steps.compile-fcm.outcome == 'skipped'
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          {
            echo '## Native fixture compile'
            echo
            echo '**Classification:** fixture-setup-failed'
            echo "**Fixture:** $FIXTURE"
            echo '**Toolchain family:** Xcode 27 / iOS SDK 27'
            echo '**Next step:** inspect checkout, toolchain selection, dependency installation, and fixture preparation before attributing this to SDK compilation'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record unavailable toolchain
        if: failure() && steps.toolchain.outcome == 'failure'
        shell: bash
        env:
          FIXTURE: ${{ matrix.fixture }}
        run: |
          {
            echo '## Native fixture compile'
            echo
            echo '**Classification:** toolchain-unavailable'
            echo "**Fixture:** $FIXTURE"
            echo '**Expected toolchain family:** Xcode 27 / iOS SDK 27'
            echo '**Next step:** inspect the toolchain report before evaluating fixture setup or SDK compilation'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: xcode-27-preview-${{ matrix.fixture }}-logs
          path: ${{ runner.temp }}/${{ matrix.fixture }}-*.log
          if-no-files-found: ignore
          retention-days: 7
