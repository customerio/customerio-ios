name: Build sample apps

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled]
    paths-ignore:
      - '**/*.md'
  push:
    branches: [ main, feature/* ]
    paths-ignore:
      - '**/*.md'
  workflow_dispatch: # allow manual run
    inputs:
      use_latest_sdk_version:
        description: "Whether to build sample apps with the latest SDK version (newest tag)."
        type: boolean
        required: false
        default: false

concurrency:
  # Unrelated labels and body-only edits must not cancel an in-flight release or
  # ci:full run. They share a separate group, where SDK-size validation repeats.
  group: >-
    ${{ github.workflow }}-${{ github.ref }}-${{
      github.event_name == 'pull_request' &&
      ((github.event.action == 'labeled' && github.event.label.name != 'ci:full') ||
      (github.event.action == 'edited' &&
      github.event.changes.title.from == '' &&
      github.event.changes.base.ref.from == '')) &&
      'metadata' || 'validation'
    }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/feature/') }}

jobs:
  release_policy:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/reusable-release-policy.yml
    permissions:
      contents: read
    with:
      pr_title: ${{ github.event.pull_request.title }}
      base_sha: ${{ github.event.pull_request.base.sha }}
      head_sha: ${{ github.event.pull_request.head.sha }}
      ci_full: ${{ contains(github.event.pull_request.labels.*.name, 'ci:full') }}

  # Build and publish sample apps to Firebase App Distribution. Correctness is
  # covered separately by unsigned path-based sample and compatibility builds;
  # release intent or ci:full controls only this distribution side effect.
  build-sample-apps:
    if: >-
      always() &&
      (github.event_name != 'pull_request' ||
      (needs.release_policy.outputs.full_validation == 'true' &&
      (github.event.action != 'edited' || github.event.changes.title.from != '') &&
      (github.event.action != 'labeled' || github.event.label.name == 'ci:full') &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'))
    needs: release_policy
    uses: ./.github/workflows/reusable_build_sample_apps.yml
    with:
      # If manual run AND user sets 'use_latest_sdk_version' to true, get the new tag.
      use_latest_sdk_version: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.use_latest_sdk_version == 'true' }}
    secrets:
      GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64 }}
      FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64: ${{ secrets.FIREBASE_APP_DISTRIBUTION_SERVICE_ACCOUNT_CREDS_B64 }}
      CUSTOMERIO_APN_WORKSPACE_SITE_ID: ${{ secrets.CUSTOMERIO_APN_WORKSPACE_SITE_ID }}
      CUSTOMERIO_APN_WORKSPACE_CDP_API_KEY: ${{ secrets.CUSTOMERIO_APN_WORKSPACE_CDP_API_KEY }}
      SAMPLE_APPS_APN_FIREBASE_APP_ID: ${{ secrets.SAMPLE_APPS_APN_FIREBASE_APP_ID }}
      CUSTOMERIO_FCM_WORKSPACE_SITE_ID: ${{ secrets.CUSTOMERIO_FCM_WORKSPACE_SITE_ID }}
      CUSTOMERIO_FCM_WORKSPACE_CDP_API_KEY: ${{ secrets.CUSTOMERIO_FCM_WORKSPACE_CDP_API_KEY }}
      SAMPLE_APPS_FCM_FIREBASE_APP_ID: ${{ secrets.SAMPLE_APPS_FCM_FIREBASE_APP_ID }}
      SAMPLE_APPS_INSTRUCTIONS_GUIDE_LINK: ${{ secrets.SAMPLE_APPS_INSTRUCTIONS_GUIDE_LINK }}
      SLACK_NOTIFY_RELEASES_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}

  # Size is a release guardrail, so it runs for every internal non-documentation
  # PR. Main keeps warming the exact-SHA baseline cache to avoid rebuilding it.
  generate-sdk-size-reports:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]')
    runs-on: macos-26
    timeout-minutes: 60
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/generate-sdk-size-report
        id: generate-sdk-size-report
        with:
          GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64: ${{ secrets.GOOGLE_CLOUD_MATCH_READONLY_SERVICE_ACCOUNT_B64 }}
          baseline-ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event_name == 'push' && github.sha || '' }}

      - name: Find existing "SDK size reports" comment
        # A metadata-only run still validates size, but must not race a newer
        # commit when replacing the PR's single shared report comment.
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.action != 'edited' ||
          github.event.changes.title.from != '' ||
          github.event.changes.base.ref.from != '') &&
          (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
        uses: peter-evans/find-comment@3eae4d37986fb5a8592848f6a574fdf654e61f9e # v3.1.0
        id: find-sdk-size-report-comment
        with:
          issue-number: ${{ github.event.pull_request.number }}
          comment-author: 'github-actions[bot]'
          body-includes: <!-- sdk size reports -->

      - name: Send SDK size reports to the PR
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.action != 'edited' ||
          github.event.changes.title.from != '' ||
          github.event.changes.base.ref.from != '') &&
          (github.event.action != 'labeled' || github.event.label.name == 'ci:full')
        uses: peter-evans/create-or-update-comment@71345be0265236311c031f5c7866368bd1eff043 # v4.0.0
        with:
          comment-id: ${{ steps.find-sdk-size-report-comment.outputs.comment-id }}
          issue-number: ${{ github.event.pull_request.number }}
          edit-mode: replace
          body: |
            <!-- sdk size reports -->
            # SDK binary size reports 📊

            <details>
            <summary>SDK binary size of this PR</summary>

            ```
            ${{ steps.generate-sdk-size-report.outputs.sdk-size-report }}
            ```

            </details>

            <details>
            <summary>SDK binary size diff report vs. main branch</summary>

            ```
            ${{ steps.generate-sdk-size-report.outputs.sdk-size-diff-report }}
            ```

            </details>
