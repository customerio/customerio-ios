name: Xcode 27 nightly watchdog

on:
  pull_request:
    paths:
      - '.github/workflows/xcode27-nightly-watchdog.yml'
      - 'scripts/ci/check_xcode27_nightly_runs.py'
      - 'scripts/ci/test_check_xcode27_nightly_runs.py'
  schedule:
    # iOS, Flutter, and Expo start at 05:17, 06:17, and 07:17 UTC. Check after
    # an eight-hour Expo completion window rather than relying on workflow actors
    # to notice failures or absent scheduled runs.
    - cron: '17 15 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  verify-nightlies:
    name: Verify Xcode 27 nightly results
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out iOS SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Test watchdog classification
        run: python3 -m unittest scripts/ci/test_check_xcode27_nightly_runs.py

      - name: Verify scheduled runs completed successfully
        id: verify
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          result_file="$RUNNER_TEMP/xcode27-watchdog-result.txt"
          set +e
          python3 scripts/ci/check_xcode27_nightly_runs.py \
            --target customerio/customerio-ios:ios-toolchain-compatibility.yml \
            --target customerio/customerio-flutter:ios-toolchain-compatibility.yml \
            --target customerio/customerio-expo-plugin:ios-toolchain-compatibility.yml \
            --max-age-hours 26 2>&1 | tee "$result_file"
          status="${PIPESTATUS[0]}"
          set -e
          delimiter="CIO_WATCHDOG_RESULT_$(openssl rand -hex 16)"
          {
            echo "exit-code=$status"
            echo "result<<$delimiter"
            cat "$result_file"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Mobile team of a failed or missing nightly
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          (steps.verify.outputs.exit-code == '1' || steps.verify.outputs.exit-code == '3')
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "username": "Xcode 27 nightly watchdog",
              "icon_emoji": ":rotating_light:",
              "text": ${{ toJSON(format('An Xcode 27 nightly failed, remained incomplete, or did not run within 26 hours. {0} <https://github.com/{1}/actions/runs/{2}|Inspect the watchdog run>.', steps.verify.outputs.result, github.repository, github.run_id)) }}
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Mobile team of a watchdog infrastructure failure
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          (steps.verify.outputs.exit-code == '2' || steps.verify.outputs.exit-code == '3')
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "username": "Xcode 27 nightly watchdog",
              "icon_emoji": ":warning:",
              "text": ${{ toJSON(format('The watchdog could not determine complete Xcode 27 nightly health because its GitHub API/configuration check failed. Its output may also contain definite nightly failures. {0} <https://github.com/{1}/actions/runs/{2}|Inspect the watchdog run>.', steps.verify.outputs.result, github.repository, github.run_id)) }}
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Mobile team when the watchdog could not run
        if: >-
          always() &&
          failure() &&
          github.event_name == 'schedule' &&
          steps.verify.outputs.exit-code == ''
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "username": "Xcode 27 nightly watchdog",
              "icon_emoji": ":warning:",
              "text": "The Xcode 27 nightly watchdog failed before it could determine nightly health. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Inspect the watchdog run>."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Notify Mobile team of an unexpected watchdog exit
        if: >-
          always() &&
          github.event_name == 'schedule' &&
          steps.verify.outputs.exit-code != '' &&
          steps.verify.outputs.exit-code != '0' &&
          steps.verify.outputs.exit-code != '1' &&
          steps.verify.outputs.exit-code != '2' &&
          steps.verify.outputs.exit-code != '3'
        uses: slackapi/slack-github-action@70cd7be8e40a46e8b0eced40b0de447bdb42f68e # v1.26.0
        with:
          payload: |
            {
              "username": "Xcode 27 nightly watchdog",
              "icon_emoji": ":warning:",
              "text": "The Xcode 27 nightly watchdog returned unexpected exit code ${{ steps.verify.outputs.exit-code }}. <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|Inspect the watchdog run>."
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFY_RELEASES_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK

      - name: Fail unhealthy watchdog run
        if: always() && github.event_name != 'pull_request' && steps.verify.outputs.exit-code != '0'
        env:
          WATCHDOG_EXIT_CODE: ${{ steps.verify.outputs.exit-code }}
        run: exit "${WATCHDOG_EXIT_CODE:-1}"
